name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Code quality
        run: bash scripts/code-quality.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Build linux/amd64 artifact
        run: GOOS=linux GOARCH=amd64 go build -o fxtrade-linux-amd64 ./cmd/fxtrade

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxtrade-linux-amd64
          path: fxtrade-linux-amd64
          if-no-files-found: error
