name: Deploy NiftyPulse to GCP VM

# Scope: this pipeline deploys ONLY the NiftyPulse NSE scanner (binary, watchlists,
# systemd unit, and cron) to the shared VM. It never installs or restarts the fxtrade
# trading bots (universe_scanner / fx_sentiment / btc_cfd), never installs the full
# watch-cron, and never touches /opt/tradex. VM infrastructure itself is managed by
# deploy/gcp/terraform (infra-only, no startup script).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nifty-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build nifty-pulse (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o nifty-pulse ./cmd/nifty-pulse

      - name: Configure SSH
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GCP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$GCP_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy NiftyPulse only (does not touch tradex or trading bots)
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          REMOTE="${GCP_VM_USER}@${GCP_VM_HOST}"

          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            nifty-pulse watchlist.txt watchlist-nifty500-rest.txt \
            deploy/gcp/nifty-pulse.service deploy/gcp/nifty-pulse.cron \
            "${REMOTE}:/tmp/"

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$REMOTE" bash -s <<'EOF'
          set -euo pipefail
          INSTALL_ROOT=/opt/fxtrade

          # Dedicated service user + dirs (idempotent). Never touches /opt/tradex.
          id fxtrade &>/dev/null || sudo useradd --system --home-dir "$INSTALL_ROOT" --shell /usr/sbin/nologin fxtrade
          sudo mkdir -p "$INSTALL_ROOT"/bin "$INSTALL_ROOT"/logs "$INSTALL_ROOT"/data

          sudo install -m 755 /tmp/nifty-pulse "$INSTALL_ROOT/bin/nifty-pulse"
          sudo install -m 644 /tmp/watchlist.txt "$INSTALL_ROOT/watchlist.txt"
          sudo install -m 644 /tmp/watchlist-nifty500-rest.txt "$INSTALL_ROOT/watchlist-nifty500-rest.txt"
          sudo install -m 644 /tmp/nifty-pulse.service /etc/systemd/system/nifty-pulse.service
          sudo install -m 644 /tmp/nifty-pulse.cron /etc/cron.d/nifty-pulse

          sudo chown -R fxtrade:fxtrade "$INSTALL_ROOT"
          # Avoid double-scheduling: cron is the scheduler on this host.
          sudo systemctl disable --now nifty-pulse.timer 2>/dev/null || true
          sudo systemctl daemon-reload

          rm -f /tmp/nifty-pulse /tmp/watchlist.txt /tmp/watchlist-nifty500-rest.txt \
                /tmp/nifty-pulse.service /tmp/nifty-pulse.cron

          echo "== deployed =="
          ls -la "$INSTALL_ROOT/bin/nifty-pulse"
          systemctl cat nifty-pulse.service >/dev/null && echo "unit: OK"
          echo "cron: $(grep -c 'systemctl start nifty-pulse' /etc/cron.d/nifty-pulse) schedule line(s)"
          if sudo test -s "$INSTALL_ROOT/.credentials"; then
            echo "credentials: present"
          else
            echo "WARNING: $INSTALL_ROOT/.credentials missing — seed the fxtrade-credentials secret (NiftyPulse-scoped) and place it before the next run."
          fi
          test -d /opt/tradex && echo "tradex: present and untouched" || echo "tradex: not present on this host"
          EOF
