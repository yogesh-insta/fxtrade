name: Deploy to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build linux/amd64 binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o fxtrade ./cmd/fxtrade
          GOOS=linux GOARCH=amd64 go build -o nifty-pulse ./cmd/nifty-pulse
          GOOS=linux GOARCH=amd64 go build -o afl-pulse ./cmd/afl-pulse
          GOOS=linux GOARCH=amd64 go build -o afl-pulse-pregame ./cmd/afl-pulse-pregame
          GOOS=linux GOARCH=amd64 go build -o health-watch ./cmd/health-watch
          GOOS=linux GOARCH=amd64 go build -o btc-daily-email ./cmd/btc-daily-email

      - name: Configure SSH
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GCP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$GCP_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy binaries and restart service
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_PATH: ${{ secrets.GCP_VM_PATH }}
        run: |
          VM_PATH="${GCP_VM_PATH:-/opt/fxtrade/bin/fxtrade}"
          INSTALL_ROOT="$(dirname "$(dirname "$VM_PATH")")"
          REMOTE="${GCP_VM_USER}@${GCP_VM_HOST}"

          scp -i ~/.ssh/deploy_key -o BatchMode=yes fxtrade nifty-pulse afl-pulse afl-pulse-pregame health-watch btc-daily-email watchlist.txt "${REMOTE}:/tmp/"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/gcp/afl-pulse-pregame.service deploy/gcp/afl-pulse-pregame.timer "${REMOTE}:/tmp/"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/gcp/check-scheduled-jobs.sh deploy/gcp/run-health-watch.sh deploy/gcp/run-btc-daily-email.sh deploy/gcp/fxtrade-watch.cron "${REMOTE}:/tmp/"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -r data/afl "${REMOTE}:/tmp/"

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$REMOTE" bash -s <<EOF
          set -euo pipefail
          sudo install -m 755 /tmp/fxtrade "${VM_PATH}"
          sudo install -m 755 /tmp/nifty-pulse "${INSTALL_ROOT}/bin/nifty-pulse"
          sudo install -m 755 /tmp/afl-pulse "${INSTALL_ROOT}/bin/afl-pulse"
          sudo install -m 755 /tmp/afl-pulse-pregame "${INSTALL_ROOT}/bin/afl-pulse-pregame"
          sudo install -m 755 /tmp/health-watch "${INSTALL_ROOT}/bin/health-watch"
          sudo install -m 755 /tmp/btc-daily-email "${INSTALL_ROOT}/bin/btc-daily-email"
          sudo install -m 755 /tmp/check-scheduled-jobs.sh "${INSTALL_ROOT}/scripts/check-scheduled-jobs.sh"
          sudo install -m 755 /tmp/run-health-watch.sh "${INSTALL_ROOT}/scripts/run-health-watch.sh"
          sudo install -m 755 /tmp/run-btc-daily-email.sh "${INSTALL_ROOT}/scripts/run-btc-daily-email.sh"
          sudo install -m 644 /tmp/fxtrade-watch.cron /etc/cron.d/fxtrade-watch
          if [[ ! -f /etc/systemd/system/afl-pulse-pregame.service ]]; then
            sudo install -m 644 /tmp/afl-pulse-pregame.service /etc/systemd/system/afl-pulse-pregame.service
            sudo install -m 644 /tmp/afl-pulse-pregame.timer /etc/systemd/system/afl-pulse-pregame.timer
            sudo systemctl daemon-reload
            if systemctl is-enabled afl-pulse-pregame.timer &>/dev/null; then
              :
            elif systemctl list-unit-files afl-pulse-pregame.timer --no-legend 2>/dev/null | grep -q afl-pulse-pregame.timer; then
              sudo systemctl enable --now afl-pulse-pregame.timer || true
            fi
          fi
          sudo install -o fxtrade -g fxtrade -m 644 /tmp/watchlist.txt "${INSTALL_ROOT}/watchlist.txt"
          sudo mkdir -p "${INSTALL_ROOT}/data/afl"
          sudo cp -f /tmp/afl/*.json "${INSTALL_ROOT}/data/afl/"
          sudo chown -R fxtrade:fxtrade "${INSTALL_ROOT}/data/afl"
          rm -f /tmp/fxtrade /tmp/nifty-pulse /tmp/afl-pulse /tmp/afl-pulse-pregame /tmp/health-watch /tmp/btc-daily-email /tmp/watchlist.txt
          rm -f /tmp/check-scheduled-jobs.sh /tmp/run-health-watch.sh /tmp/run-btc-daily-email.sh /tmp/fxtrade-watch.cron
          rm -f /tmp/afl-pulse-pregame.service /tmp/afl-pulse-pregame.timer
          rm -rf /tmp/afl
          restarted=0
          if systemctl is-enabled fxtrade.service &>/dev/null; then
            sudo systemctl restart fxtrade.service
            restarted=1
          fi
          while IFS= read -r unit; do
            [[ -z "\$unit" ]] && continue
            sudo systemctl restart "\$unit"
            restarted=1
          done < <(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '\$1 ~ /^fxtrade@.+\\.service\$/ && \$2 == "enabled" {print \$1}')
          if [[ \$restarted -eq 0 ]]; then
            echo "No enabled fxtrade units — binary updated at ${VM_PATH}"
            echo "Enable with: sudo systemctl enable --now fxtrade.service"
            echo "  or: sudo ./deploy/gcp/install.sh --enable-bot BOT_ID"
          fi
          EOF
